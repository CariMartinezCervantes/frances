<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Français 2e ESO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f2f4f8;--surface:#fff;--ink:#1b2238;--muted:#5a6380;--line:#d6dbe7;--accent:#2e7d5b;
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111523;--surface:#1a2033;--ink:#e8ecf6;--muted:#a1aac4;--line:#2e3650;--accent:#3f9a72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh}
header{background:var(--accent);color:#fff;padding:28px 16px 32px}
.wrap{max-width:820px;margin:0 auto}
.back{color:#fff;opacity:.9;text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.2rem);margin:.4em 0 0;line-height:1.05}
main{max-width:820px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.lock{max-width:420px;margin:24px auto;text-align:center}
.lock .big{font-size:3rem}
.lock h2{font-family:var(--display);margin:.2em 0}
.lock p{color:var(--muted)}
input{font:inherit;font-size:1.1rem;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:8px 0 12px;text-align:center}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;font-weight:700;font-size:1.05rem;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;width:100%}
.err{color:#c0392b;font-weight:700;min-height:1.4em;margin:8px 0 0}
.list{display:grid;gap:14px;padding:0;margin:0;list-style:none}
.list a{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .12s}
.list a:hover,.list a:focus-visible{transform:translateX(4px);outline:none;border-color:var(--accent)}
.ico{font-size:2rem}
.t{font-family:var(--display);font-weight:800;font-size:1.25rem;display:block}
.d{color:var(--muted)}
.empty{text-align:center;color:var(--muted)}
.empty .big{font-size:3rem}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.tabs a{background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:700;text-decoration:none}
.tabs a:hover,.tabs a:focus-visible{background:var(--accent);color:#fff;outline:none}
.rub{margin:0 0 30px;scroll-margin-top:12px}
.rub h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.rub .none{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="../">← Toutes les classes</a>
  <h1>🎒 Français · 2<sup>e</sup> ESO</h1>
</div></header>
<main>
  <form class="card lock" id="lock">
    <div class="big">🔒</div>
    <h2>Mot de passe</h2>
    <p>Écris le mot de passe de ta classe.</p>
    <input id="pw" type="password" autocomplete="off" aria-label="Mot de passe">
    <button type="submit">Entrer</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <section id="content" hidden>
    <nav class="tabs" id="tabs"></nav>
    <div id="rubs"></div>
  </section>
</main>
<script>
// ====== PARA CAMBIAR LA CLAVE DE ESTE CURSO, CAMBIA SOLO LO QUE VA ENTRE COMILLAS ======
const CLAVE = "cartable2";
// ====== LOS APARTADOS DEL CURSO (para añadir uno, copia una línea y cambia los datos) ======
const APARTADOS = [
  { "id": "vocabulaire", "titre": "Vocabulaire", "icone": "📚" },
  { "id": "activites",   "titre": "Activités",   "icone": "🎯" },
  { "id": "materiel",    "titre": "Matériel",    "icone": "🗂️" }
];
// ====== EL CONTENIDO: para añadir algo, copia un bloque { ... } y cambia los datos ======
// En "apartado" pon: vocabulaire, activites o materiel
const CONTENUS = [
  {
    "apartado": "materiel",
    "titre": "Ma vie de collégien",
    "desc": "Fiches de travail (PDF)",
    "lien": "ma-vie-de-collegien.pdf",
    "icone": "📄"
  },
  {
    "apartado": "activites",
    "titre": "Halloween au collège",
    "desc": "Vocabulaire, BD, l'heure et les lieux du collège (activité interactive + PDF)",
    "lien": "halloween.html",
    "icone": "🎃"
  }
];
// =======================================================================================
const KEY = "fr-ok-2eso";
const lock = document.getElementById("lock"), content = document.getElementById("content");
function ok(){ try{ return sessionStorage.getItem(KEY) === "1"; }catch(e){ return false; } }
function show(){
  lock.hidden = true; content.hidden = false;
  const tabs = document.getElementById("tabs"), rubs = document.getElementById("rubs");
  APARTADOS.forEach(r => {
    const tab = document.createElement("a");
    tab.href = "#" + r.id; tab.textContent = r.icone + " " + r.titre; tabs.appendChild(tab);
    const sec = document.createElement("section");
    sec.className = "rub"; sec.id = r.id;
    sec.innerHTML = `<h2></h2><ul class="list"></ul><p class="none">Bientôt ici&nbsp;!</p>`;
    sec.querySelector("h2").textContent = r.icone + " " + r.titre;
    const ul = sec.querySelector("ul");
    const its = CONTENUS.filter(a => a.apartado === r.id);
    its.forEach(a => {
      const li = document.createElement("li"), link = document.createElement("a");
      link.href = a.lien;
      link.innerHTML = `<span class="ico">${a.icone || r.icone}</span><span><span class="t"></span><span class="d"></span></span>`;
      link.querySelector(".t").textContent = a.titre;
      link.querySelector(".d").textContent = a.desc || "";
      li.appendChild(link); ul.appendChild(li);
    });
    sec.querySelector(".none").hidden = its.length > 0;
    rubs.appendChild(sec);
  });
}
lock.addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("pw").value.trim().toLowerCase();
  if (v === CLAVE.toLowerCase()) { try{ sessionStorage.setItem(KEY, "1"); }catch(err){} show(); }
  else { document.getElementById("err").textContent = "Ce n'est pas le bon mot de passe. Essaie encore."; }
});
if (ok()) show(); else document.getElementById("pw").focus();
</script>
</body>
</html>
