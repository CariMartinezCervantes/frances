:root{
  --rose:#f9c9d6;--rose-d:#e98aa6;--lav:#ddd0f7;--lav-d:#9d84d8;--menthe:#c3ecd9;--menthe-d:#5fb894;
  --peche:#ffd9bf;--peche-d:#f0a070;--citron:#fff2ad;--citron-d:#e6c84a;--ciel:#c9e5f8;--ciel-d:#6aa8d8;
  --ink:#3f3a50;--ink2:#6e6880;--pen:#4767a8;--ok:#2f9466;--ko:#d9577a;--paper:#fffdf6;--line:#cfe0f2;--marge:#f4a3b8;
  --desk:#f6ece4;
}
*{box-sizing:border-box}
html{background:var(--desk)}
body{margin:0;min-height:100vh;font-family:"Patrick Hand","Comic Sans MS",cursive;color:var(--ink);font-size:20px;line-height:1.45;
  background:var(--desk);background-image:radial-gradient(#ead9cc 1.3px,transparent 1.5px);background-size:20px 20px;padding:24px 16px 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;line-height:1}
.hand{font-family:"Gochi Hand","Patrick Hand",cursive}
.es{display:block;font-style:italic;color:var(--ink2);font-size:.82em;line-height:1.3}

/* ====== cuaderno ====== */
.wrap{max-width:1070px;margin:0 auto;position:relative;padding-right:50px}
.book{position:relative;background:var(--paper);border-radius:6px 18px 18px 6px;min-height:640px;
  box-shadow:0 1px 0 #e9e1d3,0 3px 0 #fffaf0,0 4px 0 #e6dccb,0 7px 0 #fffaf0,0 8px 0 #e2d7c4,0 18px 30px rgba(120,90,70,.18);
  padding:34px 40px 40px 92px;
  background-image:
    linear-gradient(90deg,transparent 74px,var(--marge) 74px,var(--marge) 76px,transparent 76px),
    repeating-linear-gradient(180deg,transparent 0 33px,var(--line) 33px 34px);
  background-position:0 0,0 18px}
/* espiral */
.spiral{position:absolute;left:-14px;top:24px;bottom:24px;width:44px;
  background:radial-gradient(circle at 30px 50%,#e8ddd0 0 6px,#bdb2a4 6px 7px,transparent 7.5px) 0 0/44px 38px repeat-y;pointer-events:none}
.spiral::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 15px 5px at 18px 50%,transparent 0 9px,#a39a8c 9.5px 12px,transparent 12.5px) 0 0/44px 38px repeat-y;
  -webkit-mask:linear-gradient(90deg,#000 0 30px,transparent 30px);mask:linear-gradient(90deg,#000 0 30px,transparent 30px)}
/* pestañas */
.tabs{position:absolute;right:-8px;top:40px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tab{width:60px;min-height:52px;border:0;border-radius:0 14px 14px 0;padding:4px 6px 4px 14px;text-align:center;
  font-size:13px;line-height:1.1;box-shadow:2px 2px 0 rgba(0,0,0,.06);transition:transform .15s;position:relative;color:var(--ink)}
.tab .emo{display:block;font-size:20px;margin-bottom:2px}
.tab:hover:not([disabled]){transform:translateX(5px)}
.tab.cur{transform:translateX(10px);box-shadow:3px 3px 0 rgba(0,0,0,.1)}
.tab[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.tab .tick{position:absolute;right:-6px;top:-6px;font-size:14px;background:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;box-shadow:0 1px 2px rgba(0,0,0,.2)}

/* bloques de página */
h1,h2{font-family:"Gochi Hand",cursive;font-weight:400;margin:0}
.ptitle{display:flex;align-items:flex-start;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.ptitle h2{font-size:42px;line-height:1.05;position:relative;display:inline-block;padding:4px 18px;z-index:0}
.ptitle h2::before{content:"";position:absolute;inset:8px -4px 2px -6px;background:var(--c,var(--rose));opacity:.75;z-index:-1;
  border-radius:3px;transform:rotate(-1.2deg);
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 6px calc(100% - 6px),transparent 100%)}
.kind{font-size:15px;background:#fff;border:2px dashed var(--ink2);border-radius:20px;padding:2px 12px;transform:rotate(2deg);margin-top:12px;white-space:nowrap}
.washi{position:absolute;height:28px;width:120px;opacity:.85;background:repeating-linear-gradient(45deg,var(--w1) 0 8px,var(--w2) 8px 16px);
  box-shadow:0 1px 2px rgba(0,0,0,.08);pointer-events:none}
.postit{position:relative;background:var(--citron);padding:14px 18px 14px 18px;margin:6px 0 22px;max-width:640px;transform:rotate(-.8deg);
  box-shadow:0 10px 12px -8px rgba(0,0,0,.25);border-radius:2px 2px 30px 2px / 2px 2px 8px 2px}
.postit p{margin:0}
.postit .who{float:left;font-size:44px;margin:-4px 12px 0 -4px}
.postit::after{content:"";position:absolute;top:-12px;left:42%;width:90px;height:24px;background:rgba(255,255,255,.55);transform:rotate(3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.memo{background:var(--ciel);transform:rotate(1deg);max-width:560px;font-size:18px}
.memo b{color:var(--pen)}
.sketch{border:2.5px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.sketch2{border:2.5px solid var(--ink);border-radius:18px 225px 18px 255px/255px 18px 225px 18px}

/* ítems */
.items{display:grid;gap:18px}
.items.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.item{position:relative;background:rgba(255,255,255,.75);padding:14px 16px 14px 16px}
.item .n{position:absolute;left:-14px;top:-12px;width:34px;height:34px;border-radius:50%;background:var(--c,var(--rose));display:grid;place-items:center;font-family:"Gochi Hand";font-size:20px;border:2px solid var(--ink)}
.item .q{margin:0 0 8px 10px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:#fff;padding:8px 14px;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;transition:transform .12s,background .12s;font-size:19px}
.opt:hover:not([disabled]){transform:rotate(-2deg) scale(1.04)}
.opt.sel{background:var(--c,var(--rose));box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
.opt.card{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px;flex:1 1 110px;padding:10px 8px}
.opt.card .emo{font-size:38px}
.opt.card .lab{font-size:16px;line-height:1.15;text-align:center}
.opt.face{min-width:64px;flex:0 0 auto;padding:6px 10px}
.opt.face .emo{font-size:40px}
.opt[disabled]{cursor:default}
.opt.right{outline:3px solid var(--ok);outline-offset:3px}
.opt.wrong{text-decoration:line-through;text-decoration-color:var(--ko);text-decoration-thickness:3px;opacity:.75}
.mark{position:absolute;right:10px;top:-14px;font-family:"Gochi Hand";font-size:30px;transform:rotate(-8deg)}
.mark.ok{color:var(--ok)}.mark.ko{color:var(--ko)}
.sol{color:var(--ok);margin:8px 0 0 10px;font-size:18px}
.sol::before{content:"✎ ";}

/* audio */
.audio{display:flex;align-items:center;gap:8px;margin:0 0 10px 8px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--c,var(--rose));border:2.5px solid var(--ink);padding:6px 16px 6px 10px;border-radius:30px;font-size:19px;box-shadow:2px 3px 0 var(--ink)}
.play:active{transform:translate(2px,2px);box-shadow:0 1px 0 var(--ink)}
.play .emo{font-size:24px}
.play.on{animation:wob .6s ease-in-out infinite alternate}
.slow{background:#fff;border:2px dashed var(--ink);border-radius:30px;padding:4px 12px;font-size:17px}
.slow.on{animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg) scale(1.03)}}
.cassette{display:flex;gap:16px;align-items:center;background:var(--menthe);padding:16px 20px;margin:0 0 20px;max-width:640px;flex-wrap:wrap}
.cassette svg{flex:none}
.transcript{background:#fff;padding:12px 16px;margin:16px 0 0;max-width:680px;font-size:18px}
.transcript p{margin:2px 0}
.transcript b{color:var(--pen)}

/* texto con huecos */
.diary{background:rgba(255,255,255,.6);padding:18px 22px;line-height:2.15;font-size:21px;max-width:760px}
.diary .date{font-family:"Gochi Hand";font-size:24px;color:var(--pen);display:block;text-align:right}
.gap{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
.gap select{appearance:none;-webkit-appearance:none;background:var(--citron);border:0;border-bottom:2.5px solid var(--ink);padding:0 22px 0 8px;font-size:20px;border-radius:6px 6px 0 0;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 11px) 55%,calc(100% - 6px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;line-height:1.5}
.gap select:disabled{cursor:default}
.gap.ok select{background-color:var(--menthe)}.gap.ko select{background-color:#ffd3de;text-decoration:line-through}
.gap .fix{color:var(--ok);font-family:"Gochi Hand";font-size:22px}

/* fichas para ordenar */
.line{min-height:52px;border-bottom:2.5px dashed var(--ink2);display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px;margin:6px 0 10px}
.line:empty::before{content:"✎  …";color:#b9b3c4}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--c,var(--menthe));border:2px solid var(--ink);border-radius:8px 12px 7px 11px;padding:3px 12px;font-size:20px;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.tile:nth-child(odd){transform:rotate(-2deg)}.tile:nth-child(even){transform:rotate(1.5deg)}
.tile.used{visibility:hidden}
.line .tile{background:#fff}
.model{display:flex;align-items:center;gap:10px;margin:0 0 4px 10px;flex-wrap:wrap}
.model .aff{background:#fff;padding:2px 12px;border-radius:6px;border:2px solid var(--ink2)}
.bulle{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:4px 14px;font-size:19px}

/* dessin */
.drawzone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.cadre{background:#fff;padding:10px;box-shadow:0 8px 14px -8px rgba(0,0,0,.3);transform:rotate(-1deg);position:relative}
.cadre canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;background:#fff;cursor:crosshair;border-radius:4px}
.cadre .legend{text-align:center;font-family:"Gochi Hand";font-size:22px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.crayon{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);padding:0}
.crayon.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.tbtn{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:1px 10px;font-size:16px}
.tbtn.sel{background:var(--citron)}
textarea.ecrit{width:100%;min-height:260px;resize:vertical;border:2.5px solid var(--ink);border-radius:10px;padding:6px 12px;font-size:21px;line-height:34px;
  background:#fff;background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--line) 33px 34px);background-attachment:local}
.checks{list-style:none;padding:0;margin:8px 0 0;font-size:18px}
.checks li{margin:2px 0}
.checks li.on{color:var(--ok)}
.wc{font-size:17px;color:var(--ink2)}

/* portada */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.cover h1{font-size:64px;line-height:1;margin:6px 0 4px}
.cover h1 span{display:inline-block;background:var(--rose);padding:0 10px;transform:rotate(-2deg)}
.cover .sub{font-size:22px;margin:0 0 14px}
.etiquette{background:#fff;padding:18px 22px;position:relative;box-shadow:0 8px 14px -8px rgba(0,0,0,.25)}
.etiquette label{display:block;margin:8px 0 2px;font-size:18px}
.etiquette input{width:100%;border:0;border-bottom:2.5px dotted var(--ink);background:transparent;font-size:22px;padding:2px 4px;outline:none}
.etiquette input:focus{border-bottom-style:solid;background:#fffbe6}
.casque{background:var(--lav);padding:12px 16px;margin-top:18px;transform:rotate(.8deg)}
.warn{background:#ffe0e6;border:2px dashed var(--ko);padding:8px 14px;border-radius:10px;margin-top:12px;font-size:18px}
.warn.hide{display:none}

/* botones de página */
.foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:28px}
.btn{background:var(--c,var(--rose));border:2.5px solid var(--ink);padding:8px 22px;font-size:22px;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 4px 0 var(--ink)}
.btn:active:not([disabled]){transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff}
.hint{font-size:17px;color:var(--ink2)}
.confirm{display:inline-flex;gap:10px;align-items:center;background:#fff;border:2px dashed var(--ink);padding:6px 12px;border-radius:12px;flex-wrap:wrap}

/* sello de resultado */
.stamp{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border:3px solid var(--sc);color:var(--sc);border-radius:16px;transform:rotate(-4deg);
  font-family:"Gochi Hand";font-size:30px;background:rgba(255,255,255,.85);animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
.stamp .emo{font-size:44px}
.stamp small{display:block;font-size:16px;font-family:"Patrick Hand";color:var(--ink2)}
@keyframes pop{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}

/* bilan */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:10px 0 20px}
.sticker{background:#fff;padding:12px 10px;text-align:center;box-shadow:0 6px 10px -6px rgba(0,0,0,.3);position:relative}
.sticker:nth-child(odd){transform:rotate(-2deg)}.sticker:nth-child(even){transform:rotate(2deg)}
.sticker .emo{font-size:46px;display:block}
.sticker .t{font-size:16px;line-height:1.15;display:block;margin-top:4px}
.sticker .lv{display:inline-block;margin-top:6px;font-size:15px;padding:0 10px;border-radius:10px;background:var(--sc);color:#fff}
.sticker.empty{opacity:.4}
.faces{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.pdfmsg{margin-top:12px}
.msg{background:#fff;border:2px dashed var(--ink2);padding:8px 14px;border-radius:10px;font-size:18px}
.msg.good{border-color:var(--ok)}

/* doodles y confeti */
.doodle{position:absolute;pointer-events:none;opacity:.9}
.confetti{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.prueba{position:fixed;left:8px;bottom:8px;background:#d9577a;color:#fff;padding:2px 10px;border-radius:8px;font-size:14px;z-index:60}
.footnote{text-align:center;color:var(--ink2);font-size:15px;margin-top:18px}

@media (max-width:760px){
  .wrap{padding-right:0}
  body{padding:12px 16px 40px;font-size:18px}
  .book{padding:28px 18px 28px 46px;background-image:linear-gradient(90deg,transparent 34px,var(--marge) 34px,var(--marge) 36px,transparent 36px),repeating-linear-gradient(180deg,transparent 0 33px,var(--line) 33px 34px)}
  .spiral{left:-18px}
  .tabs{position:static;flex-direction:row;flex-wrap:wrap;margin:0 0 14px;gap:4px}
  .tab{width:auto;min-height:0;border-radius:12px 12px 0 0;padding:4px 8px;font-size:12px}
  .tab .emo{font-size:16px}
  .tab.cur{transform:translateY(-4px)}
  .ptitle h2{font-size:32px}
  .cover,.drawzone{grid-template-columns:1fr}
  .cover h1{font-size:46px}
  .opt.card{min-width:90px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="tabs" class="tabs" role="tablist" aria-label="Pages"></div>
  <main class="book" id="book"><div class="spiral" aria-hidden="true"></div><div id="page"></div></main>
  <p class="footnote">IES El Mayorazgo · Français 1º ESO · Unité 1</p>
</div>

];
const levelOf = r => r >= .9 ? 4 : r >= .75 ? 3 : r >= .6 ? 2 : r >= .5 ? 1 : 0;

/* ---------- estado ---------- */
let S = { id:{prenom:"",nom:"",classe:"",date:""}, ans:{}, done:{}, cur:0, dessin:null, ecrit:"", auto:null, prueba:false };
try{ const raw = localStorage.getItem(STORE_KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

const P = () => PAGES[S.cur];
const key = (p,i) => `${p.id}-${i}`;
function nItems(p){ return p.type==="texte" ? p.text.filter(x=>typeof x==="object").length : (p.items||[]).length; }
function isRight(p,i){
  const v = S.ans[key(p,i)];
  if(p.type==="ordre"){ return Array.isArray(v) && v.map(k=>p.items[i].tiles[k]).join(" ") === p.items[i].ans; }
  if(p.type==="texte"){ return v === gaps(p)[i].ok; }
  return v === p.items[i].ok;
}
function answered(p,i){
  const v = S.ans[key(p,i)];
  if(p.type==="ordre") return Array.isArray(v) && v.length >= p.items[i].ans.split(" ").length;
  return v !== undefined && v !== null;
}
function gaps(p){ return p.text.filter(x=>typeof x==="object"); }
function score(p){ const n = nItems(p); let r = 0; for(let i=0;i<n;i++) if(isRight(p,i)) r++; return {r, n, lvl: levelOf(r/n)}; }
function unlocked(idx){
  if(idx===0) return true;
  if(!idOk()) return false;
  for(let j=1;j<idx;j++) if(!S.done[PAGES[j].id]) return false;
  return true;
}
function idOk(){ return S.id.prenom.trim() && S.id.nom.trim() && S.id.classe.trim() && S.id.date.trim(); }

/* ---------- voz ---------- */
let VOICES = [];
const MALE = /thomas|henri|paul|nicolas|r[ée]my|mathieu|daniel|antoine|claude|jean|guillaume|vincent|fabrice|olivier|alain|gilles|jacques|louis|male|homme/i;
function loadVoices(){
  try{
    const all = speechSynthesis.getVoices();
    const fr = all.filter(v => /^fr/i.test(v.lang));
    const score = v => (/^fr[-_]FR/i.test(v.lang)?4:0) + (/google|natural|online|neural|premium|enhanced/i.test(v.name)?3:0) + (v.localService?0:1);
    VOICES = fr.sort((a,b)=>score(b)-score(a));
  }catch(e){ VOICES = []; }
  const w = $("#nowarn"); if(w) w.classList.toggle("hide", VOICES.length>0 || !voicesChecked);
}
let voicesChecked = false;
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} setTimeout(()=>{ voicesChecked = true; loadVoices(); }, 2500); }
else { voicesChecked = true; }
const CHAR = { nora:{pitch:1.3}, theo:{pitch:1.05, male:true}, malik:{pitch:.95, male:true}, dubois:{pitch:.9} };
function voiceFor(who){
  if(!VOICES.length) return null;
  const c = CHAR[who] || {};
  const males = VOICES.filter(v=>MALE.test(v.name)), others = VOICES.filter(v=>!MALE.test(v.name));
  if(c.male && males.length) return males[0];
  if(!c.male && others.length) return who==="dubois" && others[1] ? others[1] : others[0];
  return VOICES[0];
}
let speakingBtn = null;
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} if(speakingBtn){ speakingBtn.classList.remove("on"); speakingBtn = null; } }
function speak(lines, slow, btn){
  if(!("speechSynthesis" in window)) return;
  const again = speakingBtn === btn;
  stopSpeak(); if(again) return;
  speakingBtn = btn; btn && btn.classList.add("on");
  lines.forEach(([who,t],k) => {
    const u = new SpeechSynthesisUtterance(t.replace(/…/g,"."));
    u.lang = "fr-FR"; const v = voiceFor(who); if(v) u.voice = v;
    const c = CHAR[who] || {};
    const sameVoice = v && VOICES.length < 2;
    u.pitch = sameVoice || !v ? (c.pitch||1) : (c.male ? 1 : (c.pitch>1.1 ? 1.15 : 1));
    u.rate = slow ? .62 : .88;
    if(k===lines.length-1) u.onend = u.onerror = () => { if(speakingBtn===btn){ btn && btn.classList.remove("on"); speakingBtn = null; } };
    speechSynthesis.speak(u);
  });
}

}

function rItems(p){
  const done = S.done[p.id];
  let top = "";
  if(p.type==="dialogue"){
    top = `<div class="cassette sketch">${DOODLE.casque}<div><b class="hand" style="font-size:24px">Dans la cour du collège 🏫</b><br>Nora · Théo · Mme Dubois${audioBtns(p.id+"-all","Écouter la conversation")}</div></div>`;
  }
  const items = p.items.map((it,i) => {
    const k = key(p,i), v = S.ans[k];
    let body = "";
    if(p.type==="ordre"){
      const used = Array.isArray(v) ? v : [];
      body = `<div class="model"><span class="bulle">👧🏽 ${esc(it.aff)}</span><span class="emo" style="font-size:26px">➡️</span><span class="bulle">🐱 Non !</span></div>
        <div class="line" data-line="${k}">${used.map((t,j)=>`<button type="button" class="tile" data-unpick="${k}" data-j="${j}" ${done?"disabled":""}>${esc(it.tiles[t])}</button>`).join("")}${used.length?`<span style="align-self:center;font-size:22px">.</span>`:""}</div>
        <div class="bank">${it.tiles.map((t,j)=>`<button type="button" class="tile ${used.includes(j)?"used":""}" data-tile="${k}" data-j="${j}" ${done?"disabled":""}>${esc(t)}</button>`).join("")}</div>`;
    } else {
      const optsHtml = (p.faces ? FACES.map(f=>({e:f.e, t:""})) : it.opts).map((o,j) => {
        const isObj = typeof o === "object";
        const cls = ["opt", isObj ? (p.faces ? "face" : "card") : "", v===j ? "sel" : "", done && j===it.ok ? "right" : "", done && v===j && j!==it.ok ? "wrong" : ""].join(" ");
        const inner = isObj ? `<span class="emo">${o.e}</span>${o.t && !(it.hide && !done) || (isObj && /^\d+$/.test(o.t)) ? `<span class="lab">${esc(o.t)}</span>` : ""}` : esc(o);
        return `<button type="button" class="${cls}" data-pick="${k}" data-j="${j}" ${done?"disabled":""} aria-pressed="${v===j}" ${isObj&&o.t?`aria-label="${esc(o.t)}"`:""}>${inner}</button>`;
      }).join("");
      body = `${it.say ? audioBtns(k) : ""}${it.q ? `<p class="q">${esc(it.q)}</p>` : ""}<div class="opts">${optsHtml}</div>`;
    }
    let after = "";
    if(done){
      const ok = isRight(p,i);
      after = `<span class="mark ${ok?"ok":"ko"}">${ok?"✔ Bravo":"✘"}</span>`;
      if(!ok) after += `<p class="sol">${esc(solutionText(p,i))}</p>`;
      if(it.say) after += `<p class="sol" style="color:var(--pen)">🎧 « ${esc(it.say.map(x=>x[1]).join(" — "))} »</p>`;
    }
    return `<div class="item sketch${i%2?"2":""}"><span class="n">${i+1}</span>${body}${after}</div>`;
  }).join("");
  let transcript = "";
  if(done && p.dialogue){
    const N = {nora:"Nora", theo:"Théo", dubois:"Mme Dubois", malik:"Malik"};
    transcript = `<div class="transcript sketch2"><p class="hand" style="font-size:22px">📝 La conversation</p>${p.dialogue.map(([w,t])=>`<p><b>${N[w]} :</b> ${esc(t)}</p>`).join("")}</div>`;
  }
  return `${head(p)}${doodle(p.type==="ordre"?"heart":"star","right:30px;top:24px;transform:rotate(10deg)")}${top}
    <div class="items${p.type==="ecoute"&&!p.faces?" two":""}">${items}</div>${transcript}${footer(p)}`;
}

function rTexte(p){
  const done = S.done[p.id]; let gi = -1;
  const html = p.text.map(seg => {
    if(typeof seg === "string") return esc(seg);
    gi++; const k = key(p,gi), v = S.ans[k];
    const st = done ? (v===seg.ok ? " ok" : " ko") : "";
    return `<span class="gap${st}"><select data-sel="${k}" aria-label="Trou ${gi+1}" ${done?"disabled":""}><option value="" ${v==null?"selected":""}>…</option>${seg.opts.map((o,j)=>`<option value="${j}" ${v===j?"selected":""}>${esc(o)}</option>`).join("")}</select>${done && v!==seg.ok ? `<span class="fix">${esc(seg.opts[seg.ok])}</span>` : ""}</span>`;
  }).join("");
  return `${head(p)}${doodle("flower","right:30px;top:20px")}
    <div class="diary sketch"><div class="washi" style="--w1:#fff2ad;--w2:#fff9d6;top:-14px;left:-20px;transform:rotate(-12deg)"></div><span class="date">${esc(p.date)}</span>${html}</div>${footer(p)}`;
}

function footer(p){
  const idx = PAGES.indexOf(p), done = S.done[p.id];
  if(done){
    const s = score(p), L = LEVELS[s.lvl];
    return `<div class="foot"><span class="stamp" style="--sc:${L.c}"><span class="emo">${p.sticker}</span><span>${L.fr}<small>${L.k} · ${L.es} · sticker gagné !</small></span></span>
      <button class="btn" data-next>Page suivante ➜</button></div>`;
  }
  const n = nItems(p); let miss = 0; for(let i=0;i<n;i++) if(!answered(p,i)) miss++;
  return `<div class="foot" id="foot"><button class="btn" data-check ${miss?"disabled":""}>Je vérifie ✔</button>
    <span class="hint">${miss ? `Il reste ${miss} réponse${miss>1?"s":""}.<span class="es">Te ${miss>1?"faltan":"falta"} ${miss} respuesta${miss>1?"s":""}.</span>` : `Attention : tu ne peux vérifier qu'une fois !<span class="es">¡Ojo! Solo puedes corregir una vez.</span>`}</span></div>`;
}

      ${done?"":`<div class="tools">${pal.map(c=>`<button type="button" class="crayon${c===penColor?" sel":""}" data-color="${c}" style="background:${c}" aria-label="couleur"></button>`).join("")}
        <button type="button" class="tbtn${penSize===4?" sel":""}" data-size="4">fin</button><button type="button" class="tbtn${penSize===10?" sel":""}" data-size="10">gros</button><button type="button" class="tbtn${penSize===26?" sel":""}" data-size="26">feutre</button>
        <button type="button" class="tbtn${penColor==="#ffffff"?" sel":""}" data-color="#ffffff">🧽 gomme</button><button type="button" class="tbtn" data-clear>🗑️ tout effacer</button></div>

      <ul class="checks" id="checks">${CHECKS.map(c=>`<li class="${c.re.test(S.ecrit)?"on":""}">${c.re.test(S.ecrit)?"☑":"☐"} ${esc(c.fr)}</li>`).join("")}</ul>
      <p class="hint">Cette liste t'aide à relire. Ce n'est pas une note.<span class="es">Esta lista te ayuda a repasar. No es una nota: tu profesora corregirá tu texto.</span></p>

  ${done ? `<div class="foot"><span class="stamp" style="--sc:#9d84d8"><span class="emo">🎨</span><span>Merci !<small>Ta professeure va lire ton message.</small></span></span><button class="btn" data-next>Page suivante ➜</button></div>`
    : `<div class="foot" id="foot2"></div>`}`;
}
function dessinMissing(){
  const m = []; const p = PAGES.find(q=>q.id==="moi");
  if(!S.dessin) m.push("Dessine ton portrait.<span class='es'>Dibuja tu retrato.</span>");
  const w = words(S.ecrit); if(w < p.minWords) m.push(`Écris encore ${p.minWords-w} mot${p.minWords-w>1?"s":""}.<span class='es'>Escribe ${p.minWords-w} palabra${p.minWords-w>1?"s":""} más.</span>`);
  return m;
}
function refreshFoot2(){
  const f = $("#foot2"); if(!f) return; const m = dessinMissing();
  f.innerHTML = `<button class="btn" data-validate ${m.length?"disabled":""}>J'ai fini ✔</button><span class="hint">${m.length?m.join(" "):"Relis ton message avant de valider.<span class='es'>Relee tu mensaje antes de terminar.</span>"}</span>`;
}
let penColor = "#3f3a50", penSize = 10, drawing = false, last = null, saveT = null;
function initCanvas(){
  const cv = $("#cv"); if(!cv) return; const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  if(S.dessin){ const img = new Image(); img.onload = () => ctx.drawImage(img,0,0,cv.width,cv.height); img.src = S.dessin; }
  refreshFoot2();
  if(S.done.moi) return;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); dot(ctx,last); });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const pt = pos(e); ctx.strokeStyle = penColor; ctx.lineWidth = penColor==="#ffffff" ? 34 : penSize; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...pt); ctx.stroke(); last = pt; });
  const end = () => { if(!drawing) return; drawing = false; clearTimeout(saveT); saveT = setTimeout(()=>{ S.dessin = cv.toDataURL("image/jpeg", .78); save(); refreshFoot2(); }, 150); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
}
function dot(ctx,[x,y]){ ctx.fillStyle = penColor; ctx.beginPath(); ctx.arc(x,y,(penColor==="#ffffff"?34:penSize)/2,0,Math.PI*2); ctx.fill(); }

  <div id="pdfMsg" class="pdfmsg"></div>`;

/* ---------- textos para soluciones y PDF ---------- */
function optText(p,i,j){
  const it = p.items[i];
  if(p.faces) return FACES[j] ? `${FACES[j].t}` : "";
  const o = it.opts[j]; return typeof o === "object" ? o.t : o;
}
function solutionText(p,i){
  if(p.type==="ordre") return p.items[i].ans.replace(/' /g,"'") + ".";
  if(p.type==="texte") return gaps(p)[i].opts[gaps(p)[i].ok];
  return optText(p,i,p.items[i].ok);
}
function answerText(p,i){
  const v = S.ans[key(p,i)];
  if(p.type==="ordre") return Array.isArray(v) ? v.map(k=>p.items[i].tiles[k]).join(" ").replace(/' /g,"'") + "." : "-";
  if(p.type==="texte") return v==null ? "-" : gaps(p)[i].opts[v];
  return v==null ? "-" : optText(p,i,v);
}
function questionText(p,i){
  const it = p.items[i];
  if(it.say) return `Audio : « ${it.say.map(x=>x[1]).join(" - ")} »`;
  if(p.type==="ordre") return `${it.aff} -> forme négative`;
  return it.q;
}

/* ---------- eventos ---------- */
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.id){
    S.id[t.dataset.id] = t.value; save();
    if(t.dataset.id==="prenom" && t.value.trim()==="PROFE2026"){ modePrueba(); return; }
    const b = $("[data-next]"); if(b) b.disabled = !idOk();
    const h = $("#idhint"); if(h) h.innerHTML = idOk() ? "" : "Écris ton prénom, ton nom, ta classe et la date.<span class='es'>Escribe tu nombre, apellidos, grupo y fecha.</span>";
    renderTabsOnly(); return;
  }
  if(t.id==="ecrit"){

    refreshFoot2();

});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.sel){ S.ans[t.dataset.sel] = t.value==="" ? null : +t.value; save(); refreshFoot(); }
});
function renderTabsOnly(){ const cur = S.cur; const tabs = $("#tabs"); tabs.querySelectorAll(".tab").forEach((b,i)=>{ b.disabled = !unlocked(i); }); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const p = P();
  if(b.dataset.go!==undefined){ stopSpeak(); S.cur = +b.dataset.go; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(b.hasAttribute("data-next")){ stopSpeak(); if(S.cur < PAGES.length-1 && unlocked(S.cur+1)){ S.cur++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); } return; }
  if(b.dataset.say){
    const id = b.dataset.say, slow = !!b.dataset.slow;
    if(id.endsWith("-all")) speak(p.dialogue, slow, b);
    else { const i = +id.split("-").pop(); speak(p.items[i].say, slow, b); }
    return;
  }
  if(b.dataset.pick && !S.done[p.id]){
    S.ans[b.dataset.pick] = +b.dataset.j; save();
    b.parentElement.querySelectorAll(".opt").forEach(o => { const on = o===b; o.classList.toggle("sel", on); o.setAttribute("aria-pressed", on); });
    refreshFoot(); return;
  }
  if(b.dataset.tile && !S.done[p.id]){
    const k = b.dataset.tile, arr = Array.isArray(S.ans[k]) ? S.ans[k] : [];
    const j = +b.dataset.j; if(!arr.includes(j)){ arr.push(j); S.ans[k] = arr; save(); render(); } return;
  }
  if(b.dataset.unpick && !S.done[p.id]){
    const k = b.dataset.unpick, arr = S.ans[k] || []; arr.splice(+b.dataset.j,1); S.ans[k] = arr; save(); render(); return;
  }
  if(b.hasAttribute("data-check")){
    const f = $("#foot");
    f.innerHTML = `<span class="confirm">Tu es sûr(e) ? Tu ne pourras plus changer tes réponses.<span class="es">¿Seguro? Ya no podrás cambiar tus respuestas.</span><button class="btn" data-sure>Oui, je vérifie</button><button class="btn ghost" data-cancel>Non, attends</button></span>`;
    return;
  }
  if(b.hasAttribute("data-cancel")){ refreshFoot(); return; }
  if(b.hasAttribute("data-sure")){
    stopSpeak(); S.done[p.id] = true; save(); render();
    const s = score(p); if(s.lvl >= 3) confetti();
    const st = document.querySelector(".stamp"); if(st) st.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  if(b.dataset.color){ penColor = b.dataset.color; document.querySelectorAll(".crayon,.tbtn[data-color]").forEach(x=>x.classList.toggle("sel", x===b)); return; }
  if(b.dataset.size){ penSize = +b.dataset.size; if(penColor==="#ffffff") penColor = "#3f3a50"; document.querySelectorAll(".tbtn[data-size]").forEach(x=>x.classList.toggle("sel", x===b)); document.querySelectorAll(".crayon,.tbtn[data-color]").forEach(x=>x.classList.toggle("sel", x.dataset.color===penColor)); return; }
  if(b.hasAttribute("data-clear")){
    $("#clearok").innerHTML = `<span class="confirm" style="margin-top:8px">Tout effacer ?<button class="tbtn" data-clearok>Oui</button><button class="tbtn" data-clearno>Non</button></span>`; return;
  }
  if(b.hasAttribute("data-clearno")){ $("#clearok").innerHTML = ""; return; }
  if(b.hasAttribute("data-clearok")){ const cv = $("#cv"), ctx = cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); S.dessin = null; save(); $("#clearok").innerHTML = ""; refreshFoot2(); return; }
  if(b.hasAttribute("data-validate")){
    if(dessinMissing().length) return;
    $("#foot2").innerHTML = `<span class="confirm">Tu as bien relu ? Après, tu ne pourras plus changer ton dessin ni ton message.<span class="es">¿Lo has repasado? Después no podrás cambiar el dibujo ni el mensaje.</span><button class="btn" data-validok>Oui, j'ai fini</button><button class="btn ghost" data-validno>Non, attends</button></span>`; return;
  }
  if(b.hasAttribute("data-validno")){ refreshFoot2(); return; }
  if(b.hasAttribute("data-validok")){ S.done.moi = true; save(); render(); confetti(); return; }
  if(b.dataset.auto!==undefined){ S.auto = +b.dataset.auto; save(); render(); return; }
  if(b.hasAttribute("data-pdf")){ makePdf(); return; }
  if(b.hasAttribute("data-reset")){
    if(b.dataset.sure){ try{ localStorage.removeItem(STORE_KEY); }catch(err){} location.replace(location.href.split("#")[0]); return; }
    b.dataset.sure = "1"; b.textContent = "Sûr(e) ? Clique encore pour tout effacer"; return;
  }
});

function confetti(){
  const set = ["🌸","⭐","💜","🩷","🌈","✨","🦋","💛"];
  for(let i=0;i<34;i++){
    const s = document.createElement("span"); s.className = "confetti emo"; s.textContent = set[i%set.length];
    s.style.left = Math.random()*100 + "vw"; s.style.animationDuration = (2.2+Math.random()*2.2) + "s"; s.style.animationDelay = (Math.random()*.6) + "s";
    document.body.appendChild(s); setTimeout(()=>s.remove(), 5500);
  }
}

/* ---------- modo prueba (profesora): PROFE2026 en el nombre ---------- */
function modePrueba(){
  S.prueba = true;
  S.id = {prenom:"Prueba", nom:"Profesora", classe:"1º", date:"jeudi 12 novembre"};
  PAGES.forEach(p => {
    if(!p.sticker || p.type==="dessin") return;
    const n = nItems(p);
    for(let i=0;i<n;i++){
      const wrong = (i===1 && p.id==="cava") || (i===4 && p.id==="journal");
      if(p.type==="ordre"){ const it = p.items[i]; const toks = it.ans.split(" "); const used=[]; toks.forEach(t=>{ const j = it.tiles.findIndex((x,jj)=>x===t && !used.includes(jj)); used.push(j); }); S.ans[key(p,i)] = used; }
      else if(p.type==="texte"){ const g = gaps(p)[i]; S.ans[key(p,i)] = wrong ? (g.ok+1)%g.opts.length : g.ok; }
      else { const it = p.items[i]; const nopt = p.faces ? 5 : it.opts.length; S.ans[key(p,i)] = wrong ? (it.ok+1)%nopt : it.ok; }
    }

let downloadsP = null;

  const PCOL = {rose:[249,201,214], lav:[221,208,247], menthe:[195,236,217], peche:[255,217,191], citron:[255,242,173], ciel:[201,229,248]};

  const yTop = y; const tx = L+90, tw = W-90;
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...ink); doc.text(clean(`Message de l'élève (${words(S.ecrit)} mots) :`), tx, y); y += 5.5;
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  const lines = doc.splitTextToSize(clean(S.ecrit.replace(/\n+/g," ")), tw);
  lines.forEach(l => { if(y > BOTTOM){ doc.addPage(); paper(); y = 20; } doc.text(l, tx, y); y += 5.2; });
  y = Math.max(y, yTop + 66) + 3;
  txt("Je relis mon message (indicateurs automatiques, ce n'est pas une note) :", {style:"bold"});
  CHECKS.forEach(c => { const on = c.re.test(S.ecrit); txt(`${on?"[x]":"[  ]"} ${c.fr}`, {indent:3, color: on?green:muted}); });
  y += 2; txt("Échelle pour la professeure :", {style:"bold"});
  const ECH = [
    "No se presenta o el texto no se entiende; casi no usa être ni avoir.",
    "Se presenta con frases muy sencillas; usa être o avoir con errores frecuentes; falta la negación o es incorrecta.",
    "Saluda, dice nombre y edad; usa être y avoir con algunos errores; intenta una negación.",
    "Texto claro con saludo y despedida; être y avoir casi siempre bien (edad con avoir); negación correcta.",
    "Texto completo y ordenado; être, avoir y s'appeler correctos; negación con n' o de bien usada; añade detalles propios."
  ];
  [4,3,2,1,0].forEach(li => { ensure(9); const yy = y; pill(li, L, y); txt(ECH[li], {indent:14, size:9.5}); if(y-yy < 5.5) y = yy+5.5; y += .8; });

  const pages = doc.getNumberOfPages();
  for(let pg=1; pg<=pages; pg++){ doc.setPage(pg);
    if(S.prueba){ doc.setTextColor(214,40,40); doc.setFont("helvetica","bold"); doc.setFontSize(46); doc.text("PRUEBA - SIN VALOR", 105, 160, {align:"center", angle:35}); }

function gapContext(p,i){
  let gi=-1, prev="", next="";
  for(let k=0;k<p.text.length;k++){ if(typeof p.text[k]==="object"){ gi++; if(gi===i){ prev = typeof p.text[k-1]==="string"?p.text[k-1]:""; next = typeof p.text[k+1]==="string"?p.text[k+1]:""; break; } } }
  const a = prev.trim().split(/\s+/).slice(-4).join(" "), b = next.trim().split(/\s+/).slice(0,3).join(" ");
  return `... ${a} ___ ${b} ...`;
}

}

const AFTER_PDF = `<p class="msg" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px"><span>Si une autre personne utilise cet ordinateur après toi, efface ton carnet.<span class="es">Si otra persona usa este ordenador después, borra tu cuaderno.</span></span><button type="button" class="btn ghost" data-reset>Effacer mon carnet</button></p>`;
async function makePdf(){
